name: actualforge

services:
  actualforge:
    image: ghcr.io/tojollinor/actualforge:${ACTUALFORGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      finance-engine:
        condition: service_healthy
    ports:
      - "${ACTUALFORGE_PORT:-5006}:5006"
    environment:
      ACTUAL_PORT: "5006"
      ACTUAL_HOSTNAME: "0.0.0.0"
      ACTUAL_DATA_DIR: "/data"
      ACTUALFORGE_FINANCE_ENGINE_URL: "http://finance-engine:5010"
    volumes:
      - actualforge-data:/data
    networks:
      - actualforge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  finance-engine:
    image: ghcr.io/tojollinor/actualforge-finance-engine:${FINANCE_ENGINE_TAG:-0.1.0}
    restart: unless-stopped
    expose:
      - "5010"
    environment:
      FINANCE_ENGINE_HOST: "0.0.0.0"
      FINANCE_ENGINE_PORT: "5010"
      FINANCE_ENGINE_DATA_DIR: "/data"
      ACTUALFORGE_ACTUAL_URL: "http://actualforge:5006"
    volumes:
      - finance-engine-data:/data
    networks:
      - actualforge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  actualforge-internal:
    driver: bridge

volumes:
  actualforge-data:
  finance-engine-data:
