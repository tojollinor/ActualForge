name: Block 5 verification

on:
  push:
    branches:
      - actualforge/block5

permissions:
  contents: read

jobs:
  verify-payment-chains:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ActualForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh workspace lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Test finance-engine
        run: yarn workspace @actualforge/finance-engine test

      - name: Typecheck finance-engine
        run: yarn workspace @actualforge/finance-engine typecheck

      - name: Test authenticated ActualForge bridge
        run: yarn workspace @actual-app/sync-server exec vitest --run src/app-actualforge.test.ts

      - name: Typecheck loot-core
        run: yarn workspace @actual-app/core typecheck

      - name: Typecheck web client
        run: yarn workspace @actual-app/web typecheck

      - name: Typecheck sync-server
        run: yarn workspace @actual-app/sync-server typecheck

      - name: Build web client
        run: yarn workspace @actual-app/web build

      - name: Build sync-server
        run: yarn workspace @actual-app/sync-server build

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build and start ActualForge
        run: docker compose -f compose.yaml up --build -d

      - name: Smoke-test returned payment chain
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -f compose.yaml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5006/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5006/health >/dev/null

          curl --fail --silent             -H 'Content-Type: application/json'             -d '{"password":"actualforge-ci"}'             http://127.0.0.1:5006/account/bootstrap >/tmp/bootstrap.json

          curl --fail --silent             -H 'Content-Type: application/json'             -d '{"password":"actualforge-ci","loginMethod":"password"}'             http://127.0.0.1:5006/account/login >/tmp/login.json

          TOKEN="$(node -e "const x=require('/tmp/login.json'); process.stdout.write(x.data.token)")"

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"title":"CI Internet","provider":"ExampleTel","accountId":"account-ci","amountMinor":4999,"amountMode":"fixed","currency":"EUR","nextPaymentDate":"2026-10-05"}'             http://127.0.0.1:5006/actualforge/api/contracts >/tmp/contract.json

          CONTRACT_ID="$(node -e "const x=require('/tmp/contract.json'); process.stdout.write(x.contract.id)")"

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d "{\"contractId\":\"$CONTRACT_ID\"}"             http://127.0.0.1:5006/actualforge/api/payment-chains >/tmp/chain.json

          CHAIN_ID="$(node -e "const x=require('/tmp/chain.json'); process.stdout.write(x.paymentChain.id)")"

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"actualTransactionId":"ci-first","role":"payment_attempt","amountMinor":-4999,"date":"2026-10-05"}'             "http://127.0.0.1:5006/actualforge/api/payment-chains/$CHAIN_ID/links" >/tmp/first.json

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"actualTransactionId":"ci-return","role":"reversal","amountMinor":4999,"date":"2026-10-08"}'             "http://127.0.0.1:5006/actualforge/api/payment-chains/$CHAIN_ID/links" >/tmp/return.json

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"actualTransactionId":"ci-final","role":"settlement","amountMinor":-5499,"date":"2026-10-12","splits":[{"kind":"contract_amount","amountMinor":4999},{"kind":"return_fee","amountMinor":500}]}'             "http://127.0.0.1:5006/actualforge/api/payment-chains/$CHAIN_ID/links" >/tmp/final.json

          node - <<'NODE'
          const result = require('/tmp/final.json');
          if (result.chain.status !== 'settled') {
            throw new Error('payment chain did not settle');
          }
          if (result.summary.finalPaymentMinor !== 4999) {
            throw new Error('final payment summary is wrong');
          }
          if (result.summary.feeTotalMinor !== 500) {
            throw new Error('fee split summary is wrong');
          }
          if (result.summary.reversalCount !== 1) {
            throw new Error('reversal was not retained');
          }
          NODE
