name: Block 4 verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out ActualForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh workspace lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Test finance-engine
        run: yarn workspace @actualforge/finance-engine test

      - name: Typecheck finance-engine
        run: yarn workspace @actualforge/finance-engine typecheck

      - name: Test authenticated ActualForge bridge
        run: yarn workspace @actual-app/sync-server exec vitest --run src/app-actualforge.test.ts

      - name: Typecheck loot-core
        run: yarn workspace @actual-app/core typecheck

      - name: Typecheck web client
        run: yarn workspace @actual-app/web typecheck

      - name: Typecheck sync-server
        run: yarn workspace @actual-app/sync-server typecheck

      - name: Build web client
        run: yarn workspace @actual-app/web build

      - name: Build sync-server
        run: yarn workspace @actual-app/sync-server build

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build and start ActualForge
        run: docker compose -f compose.yaml up --build -d

      - name: Smoke-test authenticated contract flow
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -f compose.yaml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5006/health >/dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5006/health >/dev/null

          curl --fail --silent             -H 'Content-Type: application/json'             -d '{"password":"actualforge-ci"}'             http://127.0.0.1:5006/account/bootstrap >/tmp/bootstrap.json

          curl --fail --silent             -H 'Content-Type: application/json'             -d '{"password":"actualforge-ci","loginMethod":"password"}'             http://127.0.0.1:5006/account/login >/tmp/login.json

          TOKEN="$(node -e "const x=require('/tmp/login.json'); process.stdout.write(x.data.token)")"

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             http://127.0.0.1:5006/actualforge/api/engine/ready >/tmp/ready.json

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"title":"CI Internet","provider":"ExampleTel","kind":"telecom","amountMinor":4999,"amountMode":"fixed","currency":"EUR","recurrence":"monthly","nextPaymentDate":"2026-10-15"}'             http://127.0.0.1:5006/actualforge/api/contracts >/tmp/contract.json

          CONTRACT_ID="$(node -e "const x=require('/tmp/contract.json'); process.stdout.write(x.contract.id)")"

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             http://127.0.0.1:5006/actualforge/api/contracts >/tmp/contracts.json

          curl --fail --silent             -H "X-ACTUAL-TOKEN: $TOKEN"             -H 'Content-Type: application/json'             -d '{"candidates":[{"actualTransactionId":"ci-tx-1","date":"2026-10-15","amountMinor":-4999,"accountId":"account-ci","payeeName":"ExampleTel"}]}'             "http://127.0.0.1:5006/actualforge/api/contracts/$CONTRACT_ID/suggestions" >/tmp/suggestions.json

          node - <<'NODE'
          const contracts = require('/tmp/contracts.json');
          const suggestions = require('/tmp/suggestions.json');
          if (!Array.isArray(contracts.contracts) || contracts.contracts.length !== 1) {
            throw new Error('contract list verification failed');
          }
          if (!Array.isArray(suggestions.suggestions) || suggestions.suggestions.length === 0) {
            throw new Error('contract suggestion verification failed');
          }
          NODE

      - name: Finalize Block 4
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/block4-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock .github/workflows/block4-verify.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: finalize Block 4 verification"
          git push origin HEAD:main
