name: Block 6 verification

on:
  push:
    branches:
      - actualforge/block6

permissions:
  contents: read

concurrency:
  group: block6-verification
  cancel-in-progress: true

jobs:
  verify-transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - run: corepack enable
      - env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install
      - run: yarn workspace @actualforge/finance-engine test
      - run: yarn workspace @actualforge/finance-engine typecheck
      - run: yarn workspace @actual-app/sync-server exec vitest --run src/app-actualforge.test.ts
      - run: yarn workspace @actual-app/core typecheck
      - run: yarn workspace @actual-app/web typecheck
      - run: yarn workspace @actual-app/sync-server typecheck
      - run: yarn workspace @actual-app/web build
      - run: yarn workspace @actual-app/sync-server build
      - run: docker compose -f compose.yaml config >/dev/null
      - run: docker compose -f compose.yaml up --build -d
      - name: Smoke-test finance-engine transfer flow
        run: |
          docker compose -f compose.yaml exec -T finance-engine node --input-type=module -e "
            const base='http://127.0.0.1:5010';
            await fetch(base+'/api/v1/credit-cards',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actualAccountId:'card-ci',fundingAccountId:'checking-ci',label:'CI Visa'})});
            const candidates=[
              {actualTransactionId:'purchase-ci',date:'2026-09-25',amountMinor:-12000,accountId:'card-ci'},
              {actualTransactionId:'checking-payment-ci',date:'2026-10-01',amountMinor:-12000,accountId:'checking-ci'},
              {actualTransactionId:'card-payment-ci',date:'2026-10-01',amountMinor:12000,accountId:'card-ci'}
            ];
            const transfers=await fetch(base+'/api/v1/transfers/suggestions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({candidates})}).then(r=>r.json());
            const analysis=await fetch(base+'/api/v1/credit-cards/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({candidates})}).then(r=>r.json());
            if(transfers.matches?.[0]?.kind!=='credit_card_payment'||transfers.matches?.[0]?.status!=='confirmed') throw new Error('settlement match failed');
            if(analysis.creditCards?.[0]?.economicExpenseMinor!==12000||analysis.creditCards?.[0]?.paymentTotalMinor!==12000) throw new Error('credit card economics failed');
          "
      - if: always()
        run: docker compose -f compose.yaml down -v
