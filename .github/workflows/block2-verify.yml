name: Block 2 verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-finance-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out ActualForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Update workspace lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Typecheck finance-engine
        run: yarn workspace @actualforge/finance-engine typecheck

      - name: Test finance-engine
        run: yarn workspace @actualforge/finance-engine test

      - name: Build finance-engine
        run: yarn workspace @actualforge/finance-engine build

      - name: Validate TypeScript project references
        run: yarn check:tsconfig-references

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build finance-engine image
        run: docker build -f finance-engine.Dockerfile -t actualforge-finance-engine:block2 .

      - name: Smoke-test finance-engine image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name actualforge-finance-engine-block2 -p 5010:5010 actualforge-finance-engine:block2

          cleanup() {
            docker rm -f actualforge-finance-engine-block2 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5010/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:5010/health
              curl --fail --silent http://127.0.0.1:5010/api/v1/status
              exit 0
            fi
            sleep 1
          done

          docker logs actualforge-finance-engine-block2
          exit 1

      - name: Rebuild ActualForge server image
        run: docker build -f sync-server.Dockerfile -t actualforge:block2 .

      - name: Finalize generated lockfile and remove one-time verifier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/block2-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock .github/workflows/block2-verify.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: finalize Block 2 workspace lockfile"
          git push origin HEAD:main
