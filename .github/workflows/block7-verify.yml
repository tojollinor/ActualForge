name: Block 7 verification

on:
  push:
    branches:
      - actualforge/block7

permissions:
  contents: read

concurrency:
  group: block7-verification
  cancel-in-progress: true

jobs:
  verify-forecast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - run: corepack enable

      - env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Test finance-engine
        run: yarn workspace @actualforge/finance-engine test

      - name: Typecheck finance-engine
        run: yarn workspace @actualforge/finance-engine typecheck

      - name: Test authenticated ActualForge bridge
        run: yarn workspace @actual-app/sync-server exec vitest --run src/app-actualforge.test.ts

      - name: Typecheck loot-core
        run: yarn workspace @actual-app/core typecheck

      - name: Typecheck web client
        run: yarn workspace @actual-app/web typecheck

      - name: Typecheck sync-server
        run: yarn workspace @actual-app/sync-server typecheck

      - name: Build web client
        run: yarn workspace @actual-app/web build

      - name: Build sync-server
        run: yarn workspace @actual-app/sync-server build

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build and start ActualForge
        run: docker compose -f compose.yaml up --build -d

      - name: Smoke-test forecast flow
        run: |
          docker compose -f compose.yaml exec -T finance-engine node --input-type=module -e "
            const base='http://127.0.0.1:5010';
            const prediction=await fetch(base+'/api/v1/predictions',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({
                title:'CI payment',
                accountId:'checking-ci',
                expectedDate:'2026-10-20',
                amountMinor:-15000,
                currency:'EUR'
              })
            });
            if(!prediction.ok) throw new Error('prediction create failed');
            const forecast=await fetch(base+'/api/v1/forecast/generate',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({
                startDate:'2026-10-02',
                endDate:'2026-10-31',
                accounts:[{
                  accountId:'checking-ci',
                  accountName:'CI Checking',
                  balanceMinor:100000
                }],
                scheduleEvents:[{
                  sourceRef:'salary-ci',
                  accountId:'checking-ci',
                  accountName:'CI Checking',
                  title:'Salary',
                  date:'2026-10-15',
                  amountMinor:200000
                }]
              })
            }).then(r=>r.json());
            if(forecast.summary?.totalEndBalanceMinor!==285000) throw new Error('forecast total failed');
            if(!forecast.entries?.some(e=>e.sourceKind==='manual'&&e.amountMinor===-15000)) throw new Error('manual prediction missing');
            if(!forecast.entries?.some(e=>e.sourceKind==='actual_schedule'&&e.amountMinor===200000)) throw new Error('schedule prediction missing');
          "

      - if: always()
        run: docker compose -f compose.yaml down -v
